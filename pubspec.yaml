name: mis_compras_app
description: "Registro local de compras, productos y gastos en CLP."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.2
  go_router: 17.5.0
  flutter_secure_storage: 11.2.0
  intl: 0.20.2
  excel: 4.0.6
  share_plus: 13.3.1
  path_provider: 2.1.6
  path: 1.9.1
  sqflite_sqlcipher: 3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  generate: true
  uses-material-design: true
